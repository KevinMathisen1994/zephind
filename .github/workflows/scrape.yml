name: Scheduled scrape

# Portal sweep, 3x daily. scraper-service/src/cli.ts writes results to Supabase
# through the /api/ingest routes, mounted in-process on the runner.

on:
  schedule:
    # 03:30, 11:30, 19:30 JST. GitHub cron is UTC (JST = UTC+9) and often starts late.
    - cron: "30 18,2,10 * * *"
  workflow_dispatch:
    inputs:
      areas:
        description: "Comma-separated JIS area codes (e.g. 13115,13109). Empty = derive from existing orders."
        required: false
        default: ""
      sources:
        description: "Comma-separated scraper sources (e.g. suumo,stepon). Empty = all known sources."
        required: false
        default: ""
      orderId:
        description: "Match against ONLY this order. Empty = every order (the nightly sweep). User-initiated scrapes set this so one account's run does not do work for another's."
        required: false
        default: ""

# A long run must never overlap the next one; queued duplicates are useless.
# Key on the WORK, not a single global lock.
#
# With one fixed group every dispatch serialized behind the last — and worse,
# GitHub keeps only ONE pending run per group, so a third dispatch silently
# cancelled the queued second one. With several people triggering scrapes from
# their phones that means quietly losing someone's run.
#
# Keying on areas+sources means: different requests run in PARALLEL (each run
# gets its own isolated VM, so there is no Chrome contention between them, and
# a public repo has unlimited Actions minutes), while an identical repeat
# request still queues behind the first instead of duplicating the work.
# The scheduled run passes no inputs, so it occupies its own "scrape--" group.
concurrency:
  group: scrape-${{ github.event.inputs.areas }}-${{ github.event.inputs.sources }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: scraper-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 or newer. Two hard requirements:
          # 1. >= 20.19: scraper-service/fix-yargs.js is ESM in a package without
          #    "type": "module", and only 20.19+ auto-detects module syntax.
          # 2. >= 22: @supabase/realtime-js constructs a RealtimeClient inside
          #    createClient() and needs a global WebSocket. Node 20 has none and
          #    the run died with "Node.js detected but native WebSocket not found"
          #    before a single page was scraped.
          node-version: "22"
          cache: npm
          cache-dependency-path: scraper-service/package-lock.json

      # puppeteer (not puppeteer-core) is the dependency and nothing in this repo
      # sets PUPPETEER_SKIP_CHROMIUM_DOWNLOAD outside the Dockerfile, so `npm ci`
      # downloads its own Chrome into ~/.cache/puppeteer. Restoring that cache
      # BEFORE npm ci makes the postinstall a no-op. (The Dockerfile's system
      # chromium + PUPPETEER_EXECUTABLE_PATH approach is deliberately not used
      # here — no scraper sets executablePath, so the bundled browser is fine.)
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('scraper-service/package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run scrape
        env:
          # No BACKEND_URL: the CLI serves the ingest routes in-process and writes
          # straight to Supabase (see createIngestClient).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Passed as env rather than argv so a dispatch input cannot inject shell.
          # Empty string falls through to the CLI's defaults (all sources, and
          # the ward codes named by existing orders).
          SCRAPE_AREA_CODES: ${{ github.event.inputs.areas }}
          # Scheduled runs use a curated high-yield subset; manual dispatch can
          # override with any sources (empty input => this default).
          #
          # BUDGET MATH — read before widening this.
          # One (source, area) pair costs roughly 60-100s. Measured today for
          # 杉並区: suumo 389 listings/101s, tokyu 265, rakuten 200, homes 126,
          # hatomark 110, nomu 109 — those six produced most of the volume.
          # All 19 sources x the 12 ward codes our orders name is ~228 pairs
          # (~2.5h), which blew the old 60-minute timeout.
          #   6 sources x 12 areas ~= 96 min/run  -> ~2900 min/month daily
          #   GitHub free: 2000 min/month on a PRIVATE repo, UNLIMITED if public.
          # So on a private repo either make the repo public, drop to every
          # other day (cron "30 18 */2 * *"), or pin SCRAPE_AREA_CODES to the
          # wards you actually work. Public repo: widen freely.
          SCRAPE_SOURCES: ${{ github.event.inputs.sources || 'suumo,tokyu,rakuten,homes,hatomark,nomu' }}
          # Scopes matching to ONE order for user-initiated runs. Empty for the
          # nightly sweep, which should match every account's orders.
          SCRAPE_ORDER_ID: ${{ github.event.inputs.orderId }}
        run: npm run scrape:cron
